<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Korean Quest">
  <meta name="description" content="Korean Fluency Quest - A gamified Korean learning app with flashcards, quizzes, and spaced repetition">
  
  <title>Korean Fluency Quest</title>
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇰🇷</text></svg>">
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <!-- Styles -->
  <link rel="stylesheet" href="styles.css">
  
  <!-- React (Production) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for JSX (in-browser compilation) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    /* Critical CSS for initial load */
    .initial-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0f;
      color: white;
      font-family: system-ui, sans-serif;
      z-index: 9999;
    }
    .initial-loader.hidden {
      display: none;
    }
    .loader-icon {
      font-size: 4rem;
      animation: bounce 1s ease-in-out infinite;
    }
    .loader-text {
      margin-top: 20px;
      font-size: 1.2rem;
      opacity: 0.7;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }
    
    /* Stat row helper */
    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      margin-bottom: 8px;
    }
    .stat-row span:first-child {
      color: var(--text-secondary);
    }
    .stat-row span:last-child {
      font-weight: 600;
      color: var(--accent-primary);
    }
  </style>
</head>
<body>
  <!-- Initial loading screen (before React loads) -->
  <div id="initial-loader" class="initial-loader">
    <div class="loader-icon">🇰🇷</div>
    <div class="loader-text">Loading Korean Fluency Quest...</div>
  </div>
  
  <!-- React mount point -->
  <div id="root"></div>
  
  <!-- 
    ═══════════════════════════════════════════════════════════════
    SCRIPT LOADING ORDER (Important!)
    1. Utilities & Helpers (no dependencies)
    2. Data files (depend on nothing)
    3. Advanced utilities (depend on helpers)
    4. Main App (depends on everything)
    ═══════════════════════════════════════════════════════════════
  -->
  
  <!-- 1. Core Utilities -->
  <script src="utils-helpers.js"></script>
  
  <!-- 2. Data Files -->
  <script src="data-vocabulary.js"></script>
  <script src="data-sentences.js"></script>
  <script src="data-levels.js"></script>
  <script src="data-grammar.js"></script>
  
  <!-- 3. Advanced Utilities -->
  <script src="utils-srs.js"></script>
  <script src="utils-audio.js"></script>
  
  <!-- 4. Main Application (Babel-compiled JSX) -->
  <script type="text/babel" src="app.jsx" data-presets="react"></script>
  
  <!-- Hide initial loader once scripts start loading -->
  <script>
    // Hide initial loader after a brief moment
    setTimeout(() => {
      const loader = document.getElementById('initial-loader');
      if (loader) loader.classList.add('hidden');
    }, 500);
  </script>
  
  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(registration => {
            console.log('✅ Service Worker registered:', registration.scope);
            
            // Check for updates
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  // New version available
                  if (confirm('A new version of Korean Fluency Quest is available! Reload to update?')) {
                    window.location.reload();
                  }
                }
              });
            });
          })
          .catch(err => console.warn('Service Worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
